services:
  larder:
    build: .
    image: larder:latest
    container_name: larder
    restart: unless-stopped
    # Only reachable from this machine. Expose it to your phone through
    # `tailscale serve` (HTTPS, needed for install + camera), not by opening this port.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    environment:
      TZ: ${TZ:-UTC}
      LARDER_BARCODE_LOOKUP: "on"
      LARDER_BACKUP_KEEP: "14"
      LARDER_TRUST_PROXY: "1"
    mem_limit: 384m
    cpus: 1.0
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
